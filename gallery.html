bredden på browservinduet. Alle billeder skal vises som lige store.
Du bestemmer selv den generelle styling af galleriet.
Der skal være en hover effekt på billederne - du må selv vælge hvilken effekt, det skal være.
Det må gerne være flere effekter, men du skal tænke på brugeroplevelsen, så det optimale
er, at effekten lægger op til, at brugeren klikker på billedet.
Man skal kunne klikke på billedet, og åbne det i en ny browser-tab. Det åbnede billede skal
